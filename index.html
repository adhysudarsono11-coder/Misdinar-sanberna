<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Tubuh Mistik - Rekoleksi Misdinar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #ffd700;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #e0e0e0;
      margin-bottom: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 12px;
    }

    .tile {
      background-size: 300px 300px;
      background-repeat: no-repeat;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      transition: transform 0.1s ease;
      background-color: #34495e;
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.empty {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      cursor: default;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      color: #333;
      border-radius: 16px;
      padding: 24px;
      max-width: 350px;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal h2 {
      color: #c0392b;
      font-size: 1.3rem;
      margin-bottom: 12px;
    }

    .modal p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #444;
      margin-bottom: 20px;
    }

    .btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
